<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0F11" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Evoluimos Comércio" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="sitemap" href="/sitemap.xml" />

    <!--
      Tudo entre app-head-start e app-head-end e substituido no build pelas tags
      da pagina concreta (title, description, canonical, Open Graph, JSON-LD),
      geradas pelo componente SEOHead. Os valores abaixo sao apenas o que o
      servidor de desenvolvimento mostra antes de o JavaScript arrancar.
      Nao acrescentar aqui title, description nem canonical: ficariam duplicados.
    -->
    <!--app-head-start-->
    <title>Aquecimento, Anti-Humidade e Eficiência Energética | Evoluimos Comércio</title>
    <meta name="description" content="Aquecimento interior e exterior, eliminação de humidade nas paredes, isolamento térmico e arrefecimento natural. Tecnologia europeia, instalação sem obras, em todo o Portugal." />
    <!--app-head-end-->

    <!-- DNS prefetch como fallback para browsers mais antigos -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Preconnect para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts centralizados aqui (único ponto de carregamento) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <!-- JSON-LD: Organização (comum a todas as páginas) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Evoluimos Comércio",
      "legalName": "Evoluimos Comércio Lda",
      "url": "https://www.evolucom.pt",
      "logo": "https://www.evolucom.pt/logo.png",
      "foundingDate": "2018",
      "founder": { "@type": "Person", "name": "Eduardo Catarino" },
      "vatID": "PT513000461",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Vila Nova de Cacela",
        "postalCode": "8900-057",
        "addressLocality": "Vila Nova de Cacela",
        "addressRegion": "Algarve",
        "addressCountry": "PT"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 37.1669,
        "longitude": -7.5374
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+351965026603",
        "email": "evolucom@gmail.com",
        "contactType": "customer service",
        "availableLanguage": ["Portuguese", "English"],
        "areaServed": ["PT", "Portugal", "Algarve", "Lisboa", "Porto", "Madeira", "Açores"]
      },
      "areaServed": [
        { "@type": "Country", "name": "Portugal" },
        { "@type": "AdministrativeArea", "name": "Algarve" },
        { "@type": "AdministrativeArea", "name": "Lisboa e Vale do Tejo" },
        { "@type": "AdministrativeArea", "name": "Norte de Portugal" },
        { "@type": "AdministrativeArea", "name": "Região Autónoma da Madeira" },
        { "@type": "AdministrativeArea", "name": "Região Autónoma dos Açores" }
      ],
      "sameAs": [
        "https://facebook.com/evoluimoscomercio",
        "https://www.facebook.com/evoluimoscomercio/",
        "https://www.instagram.com/evoluimos_edu",
        "https://linkedin.com/company/evoluimoscomercio"
      ]
    }
    </script>
    <!-- JSON-LD: Website com SearchAction (entendimento de site pelo Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Evoluimos Comércio",
      "alternateName": ["Evolucom", "Evoluimos"],
      "url": "https://www.evolucom.pt",
      "inLanguage": "pt-PT",
      "publisher": { "@type": "Organization", "name": "Evoluimos Comércio" }
    }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
